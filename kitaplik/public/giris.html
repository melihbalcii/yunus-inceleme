<body>
<main class="giris">
  <form method="post" action="/giris">
    <img class="giris-foto" src="/giris-foto.webp" alt="Kitap okuyan üç arkadaş" width="720" height="720">
    <h1>Melih'ten Dinle</h1>
    <p>Davetli arkadaşlar için sesli kitaplar.</p>
    <label for="sifre">Şifre</label>
    <input id="sifre" name="sifre" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Giriş yap</button>
    <p class="hata" id="hata" hidden>Şifre yanlış. Tekrar dene.</p>
  </form>
</main>
<script>
  if (new URLSearchParams(location.search).has("hata")) document.getElementById("hata").hidden = false;
  // şifre gönderilince sunucu yanıtına kadar düğmede bekleme halkası: boş bekleme olmasın, iki kez de basılmasın
  document.querySelector("form").addEventListener("submit", function () {
    var b = this.querySelector("button");
    b.disabled = true;
    b.classList.add("bekliyor");
    b.textContent = "Giriş yapılıyor…";
    document.getElementById("hata").hidden = true;
  });
</script>
</body>
