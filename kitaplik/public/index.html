/* açılış ekranı: stil dosyası ve eser listesi gelmeden önce de siyah zemin ve logo görünsün (beyaz ekran olmasın) */
html, body { background: #000; margin: 0; }
#acilis { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, #1f3b2b, #000 70%);
  color: #fff; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .35s ease, visibility .35s; }
#acilis.gitti { opacity: 0; visibility: hidden; }
#acilis .ac-ic { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
#acilis img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px rgb(47 211 107 / .35), 0 12px 40px rgb(0 0 0 / .6); animation: ac-nabiz 1.6s ease-in-out infinite; }
#acilis strong { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
#acilis span { color: #a7a7a7; font-weight: 500; min-height: 1.4em; }
#acilis .ac-cubuk { width: 160px; height: 4px; border-radius: 2px; background: #262626; overflow: hidden; }
#acilis .ac-cubuk i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #2fd36b; animation: ac-kay 1.1s ease-in-out infinite; }
@keyframes ac-nabiz { 50% { transform: scale(1.05); } }
@keyframes ac-kay { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { #acilis img, #acilis .ac-cubuk i { animation: none; } }
</style>

<!-- alttaki çalar: masaüstünde tam çubuk, telefonda küçük şerit (dokununca tam ekran açılır) -->
<section class="calar" id="calar" hidden aria-label="Çalar">
  <div class="calar-sol" data-islem="tam-ac">
    <div class="calar-kapak" id="calar-kapak"></div>
    <div class="calar-yazi"><strong class="js-ad"></strong><span class="js-yazar"></span></div>
  </div>
  <div class="calar-orta">
    <div class="dugmeler">
      <button class="kucuk js-hiz" data-islem="hiz" aria-label="Okuma hızı">1×</button>
      <button data-islem="geri" aria-label="15 saniye geri"><span data-simge="geri15"></span></button>
      <button class="cal-buyuk" data-islem="calduraklat" aria-label="Çal / duraklat"><span class="i-cal" data-simge="cal"></span><span class="i-dur" data-simge="dur"></span></button>
      <button data-islem="ileri" aria-label="30 saniye ileri"><span data-simge="ileri30"></span></button>
      <button class="kucuk js-uyku" data-islem="uyku" aria-label="Uyku zamanlayıcısı"><span data-simge="ay"></span><b></b></button>
    </div>
    <div class="cubuk">
      <span class="js-gecen">0:00</span>
      <input class="js-konum" type="range" min="0" max="1000" value="0" aria-label="Konum">
      <span class="js-kalan">-0:00</span>
    </div>
  </div>
  <div class="calar-sag">
    <button class="mini-cal" data-islem="calduraklat" aria-label="Çal / duraklat"><span class="i-cal" data-simge="cal"></span><span class="i-dur" data-simge="dur"></span></button>

    <button class="buyut" data-islem="tam-ac" aria-label="Tam ekran çalar"><span data-simge="buyut"></span></button>
  </div>
  <div class="mini-ilerleme"><i class="js-cizgi"></i></div>
</section>
