# Tip denetimi: araclar/ içinden  ../.venv-ses/bin/python -m mypy
[mypy]
python_version = 3.11
files = sesli, sesli_kitap.py
strict = True
warn_unreachable = True
# Büyük üçüncü taraf kütüphanelerin içi denetlenmez (yavaş ve bizim kodumuz değil); yalnız onlara yapılan çağrılar.
follow_imports_for_stubs = True

[mypy-mlx_whisper.*,torch.*,torchaudio.*,whisper.*,lameenc.*,mutagen.*,google.*,soundfile.*,scipy.*]
ignore_missing_imports = True
follow_imports = skip
