# Bağımsız puanlama: her gönderimde bütün ölçümler çalışır, puan puanlama/PUANLAMA.md'deki formülle hesaplanır.
# Puan "GEÇMEDİ" ise iş kırmızı biter. Ham çıktılar "puanlama-sonuclari" eki olarak indirilebilir.
name: Puanlama

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 6 * * 1"   # her pazartesi 06:07 UTC = 09:07 Türkiye: kod değişmese de yeni açıklar ve puan

permissions:
  contents: read

concurrency:
  group: puanlama-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scorecard bir "container" eklentisi: yalnız Linux makinede çalışır (5 Kasım'daki ilk çalıştırmada macOS'ta düştü).
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: scorecard
          path: scorecard.json

  puanlama:
    needs: scorecard
    if: always()   # Scorecard düşse de öbür ölçümler çalışır
    runs-on: macos-latest   # üretim ortamı Apple Silicon Mac
    timeout-minutes: 300
    permissions:
      contents: read
      security-events: write   # CodeQL sonuçları Security sekmesine
      actions: read
      issues: write            # haftalık rapor kaydı
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: araclar/gereksinimler*.txt

      - name: Python kütüphaneleri ve ölçüm araçları
        run: python -m pip install -r araclar/gereksinimler.txt -r araclar/gereksinimler-olcum.txt

      - name: Toxiproxy (ağ kopması testi; sha256 doğrulanır)
        run: |
          mkdir -p .cache/toxiproxy
          curl -fsSL -o .cache/toxiproxy/toxiproxy-server-darwin-arm64 \
            https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-darwin-arm64
          echo "aa299966b52f16a8594f1cd0d1e9049dc2e8fe2c04a90c19860e2719b2b95d15  .cache/toxiproxy/toxiproxy-server-darwin-arm64" | shasum -a 256 -c
          chmod +x .cache/toxiproxy/toxiproxy-server-darwin-arm64

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kitaplik/package-lock.json

      - name: Node araçları ve Chromium
        working-directory: kitaplik
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - uses: denoland/setup-deno@v2.0.4

      - name: CodeQL hazırlık
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: python, javascript-typescript
          build-mode: none

      - name: CodeQL tarama
        uses: github/codeql-action/analyze@v4.39.2
        with:
          output: codeql-sonuc

      - name: CodeQL yüksek/kritik bulgu sayısı
        run: |
          mkdir -p puanlama/sonuclar
          python - <<'EOF'
          import glob, json
          yuksek = 0
          for f in glob.glob("codeql-sonuc/*.sarif"):
              s = json.load(open(f))
              for run in s["runs"]:
                  kural = {r["id"]: r for r in run["tool"]["driver"].get("rules", [])}
                  for r in run.get("results", []):
                      ciddiyet = float(kural.get(r["ruleId"], {}).get("properties", {}).get("security-severity", 0))
                      yuksek += ciddiyet >= 7.0
          json.dump({"yuksek": yuksek}, open("puanlama/sonuclar/codeql.json", "w"))
          print("CodeQL yüksek/kritik:", yuksek)
          EOF

      - name: Scorecard sonucunu al
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true   # Scorecard işi başarısızsa bu ölçüm "ÖLÇÜLMEDİ" kalır
        with:
          name: scorecard
          path: puanlama/sonuclar/

      - name: Ölçümler ve puan
        env:
          PY: python
          DENO: deno
        run: bash puanlama/olc.sh

      - name: Özet
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          try:
              p = json.load(open("puanlama/sonuclar/puan.json"))
          except OSError:
              print("Puan hesaplanamadı."); raise SystemExit
          print(f"## Puan: {p['toplam']} / 100 — {p['sonuc']}\n")
          print("| Alan | Puan |\n|---|---|")
          for a in p["alanlar"]:
              print(f"| {a['ad']} | {a['puan']} / {a['agirlik']} |")
          print("\n| Kesin şart | Durum |\n|---|---|")
          for k in p["kesin"]:
              print(f"| {k['ad']} | {'TUTTU' if k['durum'] else ('ÖLÇÜLMEDİ' if k['durum'] is None else 'TUTMADI')} {k['ek']} |")
          EOF

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: puanlama-sonuclari
          path: puanlama/sonuclar/

      - name: Haftalık rapor kaydı
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > haftalik.md <<'EOF'
          import json
          try:
              p = json.load(open("puanlama/sonuclar/puan.json"))
          except OSError:
              print("Bu hafta puan hesaplanamadı; ayrıntı için çalıştırma günlüğüne bakın."); raise SystemExit
          print(f"**Puan: {p['toplam']} / 100 — {p['sonuc']}**\n")
          for a in p["alanlar"]:
              print(f"- {a['ad']}: {a['puan']} / {a['agirlik']}")
          print("\n**Kesin şartlar**")
          for k in p["kesin"]:
              print(f"- {'✅' if k['durum'] else ('➖' if k['durum'] is None else '❌')} {k['ad']} {k['ek']}")
          EOF
          echo "" >> haftalik.md
          echo "Çalıştırma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> haftalik.md
          gh issue create --title "Haftalık kalite raporu $(date +%d.%m.%Y)" --body-file haftalik.md
